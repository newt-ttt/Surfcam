# BoT-SORT with global motion compensation DISABLED (gmc_method: none).
# ~37ms/frame saved. Only valid while the camera is stationary/decoupled
# from the servos (mobile_tracking_servo_control.py) - re-enable
# (gmc_method: sparseOptFlow) once the camera rides the pan-tilt rig it
# steers, see research.md's GMC section.
# Pass to model.track(tracker="botsort_nogmc.yaml").

tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 30
match_thresh: 0.8
fuse_score: True

gmc_method: none  # <-- the change: no global motion compensation

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
